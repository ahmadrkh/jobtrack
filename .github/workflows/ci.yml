# GitHub Actions CI workflow for JobTrack
#
# YAML structure:
#   name       — display name in GitHub's UI
#   on         — what triggers this workflow
#   jobs       — the actual work, split into logical groups
#
# Each job runs on a fresh virtual machine (ubuntu-latest = Ubuntu 22.04).
# Jobs can run in parallel or depend on each other via `needs:`.

name: CI

on:
  push:
    branches: [main]        # Run on every push to main
  pull_request:
    branches: [main]        # Run on every PR targeting main

jobs:
  # ─── Job 1: Type checking + Build ────────────────────────────────────────
  build:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code onto the CI machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      # `cache: 'npm'` tells the runner to cache node_modules between runs
      # so installs are fast after the first time.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      # `npm ci` is stricter than `npm install`:
      #   - Requires package-lock.json to exist
      #   - Fails if lock file doesn't match package.json
      #   - Never updates the lock file
      # This guarantees reproducible builds.
      - name: Install dependencies
        run: npm ci

      # Step 4: Generate Prisma client
      # Prisma generates TypeScript types from schema.prisma.
      # Without this step, TypeScript wouldn't know the shape of
      # the Application model and the build would fail.
      - name: Generate Prisma client
        run: npx prisma generate

      # Step 5: Type-check with TypeScript (no emit = just check, no output files)
      # This catches type errors without doing a full Next.js build.
      - name: TypeScript type check
        run: npx tsc --noEmit

      # Step 6: Full Next.js production build
      # This is the real test — if `next build` passes, the app is deployable.
      # DATABASE_URL is needed because Prisma validates the connection string
      # at build time even for SQLite.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./dev.db

  # ─── Job 2: Lint ─────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run ESLint
        run: npm run lint
